<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Login</title>
    <link rel="stylesheet" href="../static/styles.css"> <!-- Enlace a tu archivo CSS -->
    </header>
<body>

<div class="login-container">
    <div class="login-form">
        <h2>Iniciar Sesión</h2>
        <form action="/login" method="POST"> <!-- action: dónde se envían los datos, method: POST para seguridad -->
            <div class="input-group">
                <label for="username">Nombre de Usuario/Email:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <a href="#">¿Olvidaste tu contraseña?</a>
    </div>
</div>

</body>
</html>
